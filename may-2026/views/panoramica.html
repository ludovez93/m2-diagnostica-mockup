<!-- ============================================================
     PANORAMICA / MESE — Mockup M2 Diagnostica 2026
     PLAN §7.8 (Calendar) + §4 tokens + §5 componenti
     Solo content della <section data-screen="panoramica">
     Mese: Maggio 2026 — 1 mag = venerdi, 2 mag = sabato (oggi)
     ============================================================ -->

<!-- 1) Screen header — titolo + nav mese + Oggi -->
<header class="screen-header page-enter stagger-1">
  <h1 class="t-screen-title flex-1">Mese</h1>
  <button type="button"
          class="btn btn-ghost btn-sm spring-tap"
          data-action="cal-today"
          aria-label="Vai a oggi">
    Oggi
  </button>
</header>

<!-- 2) Mese / anno corrente con nav < > -->
<div class="row gap-3 mb-4 page-enter stagger-2 cal-monthnav">
  <button type="button"
          class="icon-btn spring-tap"
          data-action="cal-prev"
          aria-label="Mese precedente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  <h2 class="t-card-title flex-1 text-center">Maggio 2026</h2>
  <button type="button"
          class="icon-btn spring-tap"
          data-action="cal-next"
          aria-label="Mese successivo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>
</div>

<!-- 3) Filtro chip cantieri (orizzontale scroll) -->
<div class="cal-chips mb-5 page-enter stagger-2" role="tablist" aria-label="Filtra per cantiere">
  <button type="button"
          class="pill pill-cyan cal-chip is-active spring-tap"
          data-action="cal-filter"
          data-cantiere="all"
          role="tab"
          aria-selected="true">
    Tutti
  </button>
  <button type="button"
          class="pill pill-cyan-outline cal-chip spring-tap"
          data-action="cal-filter"
          data-cantiere="laspezia"
          role="tab"
          aria-selected="false">
    La Spezia
  </button>
  <button type="button"
          class="pill pill-success-outline cal-chip spring-tap"
          data-action="cal-filter"
          data-cantiere="empoli"
          role="tab"
          aria-selected="false">
    Empoli
  </button>
  <button type="button"
          class="pill pill-warn-outline cal-chip spring-tap"
          data-action="cal-filter"
          data-cantiere="brescia"
          role="tab"
          aria-selected="false">
    Brescia
  </button>
  <button type="button"
          class="pill pill-danger-outline cal-chip spring-tap"
          data-action="cal-filter"
          data-cantiere="genova"
          role="tab"
          aria-selected="false">
    Genova
  </button>
</div>

<!-- 4) Calendario grid 7x6 — header giorni + 42 celle -->

  <!-- Header giorni settimana -->
  <span class="cal-dow t-micro text-muted" aria-hidden="true">L</span>
  <span class="cal-dow t-micro text-muted" aria-hidden="true">M</span>
  <span class="cal-dow t-micro text-muted" aria-hidden="true">M</span>
  <span class="cal-dow t-micro text-muted" aria-hidden="true">G</span>
  <span class="cal-dow t-micro text-muted" aria-hidden="true">V</span>
  <span class="cal-dow t-micro text-muted" aria-hidden="true">S</span>
  <span class="cal-dow t-micro text-muted" aria-hidden="true">D</span>

  <!-- Settimana 1: 27 28 29 30 apr | 1 2 3 mag -->
  <div class="cal-cell cal-cell--out" aria-hidden="true">27</div>
  <div class="cal-cell cal-cell--out" aria-hidden="true">28</div>
  <div class="cal-cell cal-cell--out" aria-hidden="true">29</div>
  <div class="cal-cell cal-cell--out" aria-hidden="true">30</div>

  <button type="button" class="cal-cell spring-tap" data-action="cal-day" data-date="2026-05-01" aria-label="1 maggio">
    <span class="cal-num">1</span>
  </button>

  <!-- 2 mag: oggi + La Spezia -->

          data-action="cal-day" data-date="2026-05-02"
          aria-label="2 maggio, oggi, La Spezia" aria-current="date">
    <span class="cal-num">2</span>
    <span class="cal-dots" aria-hidden="true">
      <span class="cal-dot cal-dot--cyan"></span>
    </span>

  <button type="button" class="cal-cell spring-tap" data-action="cal-day" data-date="2026-05-03" aria-label="3 maggio">

<!-- 6) Sezione PROSSIME NOTTI -->
<h2 class="t-section mb-3 page-enter stagger-4">Prossime notti</h2>

<div class="col gap-2 mb-6 page-enter stagger-4">

  <!-- Lun 5 Mag · La Spezia 22:00 -->
  <button type="button"
          class="card-subtle bento-mini spring-tap row gap-3 cal-night"

          data-date="2026-05-05"
          data-cantiere="laspezia"
