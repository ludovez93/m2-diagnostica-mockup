<!-- =====================================================================
     SCREEN 7 · SCHEDA I.1   (modal-full di compilazione difetto)
     Concept D — Operations Terminal
     Riscrittura 2026-05-02: replicato l'ordine campi ESATTO dell'app live
     (frontend/index.html righe 55-133, overlay #scheda-editor).
     UNA scheda lunga · 6 sezioni · ~23 campi · niente step indicator.
     ===================================================================== -->

<!-- ─────────────────────────────────────────────────────────────────────
     HEADER STICKY · close X · titolo · tabs Compila / Anteprima
     ───────────────────────────────────────────────────────────────────── -->
<header class="sheet-head" id="scheda-head">
  <button class="close" type="button" data-action="close-scheda" aria-label="Chiudi scheda">&times;</button>
  <span id="scheda-title" style="flex:1; text-align:left; padding-left:8px;">SCHEDA I.1</span>
  <span class="ticker" style="padding:0; margin:0; gap:6px;">
    <span class="ok blink" style="color:#000;">&#9679;</span>
    <span style="color:#000;">M2-2026-0142</span>
  </span>
</header>

<!-- ─────────────────────────────────────────────────────────────────────
     TABS Compila / Anteprima
     Riusa .step-tabs ma con 2 colonne
     ───────────────────────────────────────────────────────────────────── -->
<!-- NEED_CLASS: .step-tabs--2 → variante 2 colonne (oppure modificare .step-tabs grid-template-columns) -->
<nav class="step-tabs" role="tablist" aria-label="Modalità scheda"
     style="grid-template-columns: repeat(2, 1fr);">
  <button type="button"
          class="step-tab active"
          role="tab"
          aria-selected="true"
          aria-controls="scheda-form-panel"
          data-action="scheda-tab"
          data-tab="form">
    Compila
  </button>
  <button type="button"
          class="step-tab"
          role="tab"
          aria-selected="false"
          aria-controls="scheda-preview-panel"
          data-action="scheda-tab"
          data-tab="preview">
    Anteprima
  </button>
</nav>

<!-- ─────────────────────────────────────────────────────────────────────
     FORM PANEL · UNA scheda lunga, 6 sezioni
     ───────────────────────────────────────────────────────────────────── -->
<form class="form-scheda"
      id="scheda-form-panel"
      role="tabpanel"
      aria-labelledby="scheda-tab-form"
      data-action="scheda-submit"
      autocomplete="off"
      novalidate>

  <!-- =================================================================
       SEZIONE 1 · UBICAZIONE
       ================================================================= -->
  <fieldset class="form-step">
    <legend class="sect"><span>Ubicazione</span></legend>

    <!-- 1. Scheda Nr. -->
    <div class="form-group">
      <label class="label" for="scheda_nr">Scheda Nr.</label>
      <input class="input"
             id="scheda_nr"
             name="scheda_nr"
             type="text"
             value="M2-2026-0142"
             autocomplete="off"
             autocapitalize="characters">
    </div>

    <!-- 2. Linea + Localita' (riga 2 col) -->
    <div class="input-row">
      <div class="form-group">
        <label class="label" for="linea">Linea</label>
        <input class="input"
               id="linea"
               name="linea"
               type="text"
               value="33/26 La Spezia - Arcola"
               autocomplete="off">
      </div>
      <div class="form-group">
        <label class="label" for="localita">Localita'</label>
        <input class="input"
               id="localita"
               name="localita"
               type="text"
               value="Sarzana"
               autocomplete="off">
      </div>
    </div>

    <!-- 3. Tratta -->
    <div class="form-group">
      <label class="label" for="tratta">Tratta</label>
      <input class="input"
             id="tratta"
             name="tratta"
             type="text"
             value="Sarzana - La Spezia"
             autocomplete="off">
    </div>

    <!-- 4. Km + Sede Tecnica (riga 2 col) -->
    <div class="input-row">
      <div class="form-group">
        <label class="label" for="km">Km</label>
        <input class="input"
               id="km"
               name="km"
               type="text"
               inputmode="decimal"
               value="165+700"
               autocomplete="off">
      </div>
      <div class="form-group">
        <label class="label" for="sede">Sede Tecnica</label>
        <input class="input"
               id="sede"
               name="sede"
               type="text"
               value="DTP Genova"
               autocomplete="off">
      </div>
    </div>
  </fieldset>

  <!-- =================================================================
       SEZIONE 2 · BINARIO & FILA
       ================================================================= -->
  <fieldset class="form-step">
    <legend class="sect"><span>Binario &amp; Fila</span></legend>

    <!-- 5. Binario (Unico / Pari / Dispari) -->
    <div class="form-group">
      <span class="label" id="lbl-binario">Binario</span>
      <!-- NEED_CLASS: .pill-group--3 → variante grid-template-columns: repeat(3, 1fr) -->
      <div class="pill-group"
           role="radiogroup"
           aria-labelledby="lbl-binario"
           style="grid-template-columns: repeat(3, 1fr);">
        <input class="pill-radio-input" type="radio" name="binario" id="binario-unico" value="unico">
        <label class="pill-radio" for="binario-unico">Unico</label>

        <input class="pill-radio-input" type="radio" name="binario" id="binario-pari" value="pari">
        <label class="pill-radio" for="binario-pari">Pari</label>

        <input class="pill-radio-input" type="radio" name="binario" id="binario-dispari" value="dispari" checked>
        <label class="pill-radio" for="binario-dispari">Dispari</label>
      </div>
    </div>

    <!-- 6. Fila (DX / SX) -->
    <div class="form-group">
      <span class="label" id="lbl-fila">Fila</span>
      <!-- NEED_CLASS: .pill-group--2 → variante grid-template-columns: repeat(2, 1fr) -->
      <div class="pill-group"
           role="radiogroup"
           aria-labelledby="lbl-fila"
           style="grid-template-columns: repeat(2, 1fr);">
        <input class="pill-radio-input" type="radio" name="fila" id="fila-dx" value="dx" checked>
        <label class="pill-radio" for="fila-dx">DX</label>

        <input class="pill-radio-input" type="radio" name="fila" id="fila-sx" value="sx">
        <label class="pill-radio" for="fila-sx">SX</label>
      </div>
    </div>

    <!-- 7. Tipo Rotaia (E1 / E5 / Altro) -->
    <div class="form-group">
      <span class="label" id="lbl-rotaia">Tipo Rotaia</span>
      <div class="pill-group"
           role="radiogroup"
           aria-labelledby="lbl-rotaia"
           style="grid-template-columns: repeat(3, 1fr);">
        <input class="pill-radio-input" type="radio" name="rotaia" id="rotaia-e1" value="e1" checked>
        <label class="pill-radio" for="rotaia-e1">E1 (60UNI)</label>

        <input class="pill-radio-input" type="radio" name="rotaia" id="rotaia-e5" value="e5">
        <label class="pill-radio" for="rotaia-e5">E5 (50UNI)</label>

        <input class="pill-radio-input" type="radio" name="rotaia" id="rotaia-altro" value="altro">
        <label class="pill-radio" for="rotaia-altro">Altro</label>
      </div>
    </div>

    <!-- 8. Caratteristiche Linea (multi: All'aperto / Galleria / Retta / Curva / C. Alta / C. Bassa) -->
    <div class="form-group">
      <span class="label" id="lbl-linea-car">Caratteristiche Linea</span>
      <!-- NEED_CLASS: .pill-group--multi → grid-template-columns: repeat(3, 1fr); checkbox semantica con stesso look del pill-radio -->
      <div class="pill-group"
           role="group"
           aria-labelledby="lbl-linea-car"
           style="grid-template-columns: repeat(3, 1fr);">
        <input class="pill-radio-input" type="checkbox" name="linea_car" id="lc-aperto" value="aperto" checked>
        <label class="pill-radio" for="lc-aperto">All'aperto</label>

        <input class="pill-radio-input" type="checkbox" name="linea_car" id="lc-galleria" value="galleria">
        <label class="pill-radio" for="lc-galleria">Galleria</label>

        <input class="pill-radio-input" type="checkbox" name="linea_car" id="lc-retta" value="retta">
        <label class="pill-radio" for="lc-retta">Retta</label>

        <input class="pill-radio-input" type="checkbox" name="linea_car" id="lc-curva" value="curva" checked>
        <label class="pill-radio" for="lc-curva">Curva</label>

        <input class="pill-radio-input" type="checkbox" name="linea_car" id="lc-calta" value="calta">
        <label class="pill-radio" for="lc-calta">C. Alta</label>

        <input class="pill-radio-input" type="checkbox" name="linea_car" id="lc-cbassa" value="cbassa">
        <label class="pill-radio" for="lc-cbassa">C. Bassa</label>
      </div>
    </div>
  </fieldset>

  <!-- =================================================================
       SEZIONE 3 · CARATTERISTICHE DIFETTO
       ================================================================= -->
  <fieldset class="form-step">
    <legend class="sect"><span>Caratteristiche Difetto</span></legend>

    <!-- 9. Data Scheda -->
    <div class="form-group">
      <label class="label" for="data_scheda">Data Scheda</label>
      <input class="input"
             id="data_scheda"
             name="data_scheda"
             type="text"
             inputmode="numeric"
             placeholder="GG/MM/AAAA"
             value="13/04/2026"
             autocomplete="off">
    </div>

    <!-- 10. Rivelatore + Sonda -->
    <div class="input-row">
      <div class="form-group">
        <label class="label" for="rivelatore">Rivelatore</label>
        <input class="input"
               id="rivelatore"
               name="rivelatore"
               type="text"
               value="EPOCH 650"
               autocomplete="off">
      </div>
      <div class="form-group">
        <label class="label" for="sonda">Sonda</label>
        <input class="input"
               id="sonda"
               name="sonda"
               type="text"
               value="FTA70-2"
               autocomplete="off">
      </div>
    </div>

    <!-- 11. Accoppiamento + Fondo Scala + Guadagno -->
    <div class="input-row-3">
      <div class="form-group">
        <label class="label" for="accopp">Accoppiamento</label>
        <input class="input"
               id="accopp"
               name="accopp"
               type="text"
               value="GEL"
               autocomplete="off">
      </div>
      <div class="form-group">
        <label class="label" for="fondo_scala">Fondo Scala</label>
        <input class="input"
               id="fondo_scala"
               name="fondo_scala"
               type="text"
               inputmode="decimal"
               value="100"
               autocomplete="off">
      </div>
      <div class="form-group">
        <label class="label" for="guadagno">Guadagno</label>
        <input class="input"
               id="guadagno"
               name="guadagno"
               type="text"
               inputmode="decimal"
               value="8"
               autocomplete="off">
      </div>
    </div>

    <!-- 12. Ampiezza % + W mm + W1 mm + W2 mm (riga 4 col) -->
    <!-- NEED_CLASS: .input-row-4 → grid-template-columns: repeat(4, 1fr); gap 8px -->
    <div class="input-row-4" style="display:grid; grid-template-columns: repeat(4, 1fr); gap: 8px;">
      <div class="form-group">
        <label class="label" for="ampiezza">Ampiezza %</label>
        <input class="input"
               id="ampiezza"
               name="ampiezza"
               type="text"
               inputmode="decimal"
               value="75"
               autocomplete="off">
      </div>
      <div class="form-group">
        <label class="label" for="w">W mm</label>
        <input class="input"
               id="w"
               name="w"
               type="text"
               inputmode="decimal"
               value="25"
               autocomplete="off">
      </div>
      <div class="form-group">
        <label class="label" for="w1">W1 mm</label>
        <input class="input"
               id="w1"
               name="w1"
               type="text"
               inputmode="decimal"
               value="12"
               autocomplete="off">
      </div>
      <div class="form-group">
        <label class="label" for="w2">W2 mm</label>
        <input class="input"
               id="w2"
               name="w2"
               type="text"
               inputmode="decimal"
               value="13"
               autocomplete="off">
      </div>
    </div>

    <!-- 13. Scostamento + Superficie + Percentuale (riga 3 col) -->
    <div class="input-row-3">
      <div class="form-group">
        <label class="label" for="scost">Scostamento</label>
        <input class="input"
               id="scost"
               name="scost"
               type="text"
               inputmode="decimal"
               autocomplete="off">
      </div>
      <div class="form-group">
        <label class="label" for="superfice">Superficie</label>
        <input class="input"
               id="superfice"
               name="superfice"
               type="text"
               autocomplete="off">
      </div>
      <div class="form-group">
        <label class="label" for="percent">Percentuale</label>
        <input class="input"
               id="percent"
               name="percent"
               type="text"
               inputmode="decimal"
               autocomplete="off">
      </div>
    </div>

    <!-- 14. Lung. Fessura + Prof. Fessura -->
    <div class="input-row">
      <div class="form-group">
        <label class="label" for="lung_fess">Lung. Fessura</label>
        <input class="input"
               id="lung_fess"
               name="lung_fess"
               type="text"
               inputmode="decimal"
               value="8"
               autocomplete="off">
      </div>
      <div class="form-group">
        <label class="label" for="prof_fess">Prof. Fessura</label>
        <input class="input"
               id="prof_fess"
               name="prof_fess"
               type="text"
               inputmode="decimal"
               value="12"
               autocomplete="off">
      </div>
    </div>

    <!-- 15. Codice Difetto + Classificazione -->
    <div class="input-row">
      <div class="form-group">
        <label class="label" for="codice">Codice Difetto</label>
        <input class="input"
               id="codice"
               name="codice"
               type="text"
               inputmode="numeric"
               value="211"
               autocomplete="off">
      </div>
      <div class="form-group">
        <label class="label" for="classif">Classificazione</label>
        <input class="input"
               id="classif"
               name="classif"
               type="text"
               value="B"
               autocomplete="off"
               autocapitalize="characters">
      </div>
    </div>

    <!-- 16. Osservazioni (full width) -->
    <div class="form-group">
      <label class="label" for="note">Osservazioni</label>
      <input class="input"
             id="note"
             name="note"
             type="text"
             autocomplete="off">
    </div>
  </fieldset>

  <!-- =================================================================
       SEZIONE 4 · SEGNALAZIONI
       ================================================================= -->
  <fieldset class="form-step">
    <legend class="sect"><span>Segnalazioni</span></legend>

    <!-- 17. Galileo (Si / No) -->
    <div class="form-group">
      <span class="label" id="lbl-galileo">Galileo</span>
      <div class="pill-group"
           role="radiogroup"
           aria-labelledby="lbl-galileo"
           style="grid-template-columns: repeat(2, 1fr);">
        <input class="pill-radio-input" type="radio" name="galileo" id="galileo-si" value="si" checked>
        <label class="pill-radio" for="galileo-si">Si</label>

        <input class="pill-radio-input" type="radio" name="galileo" id="galileo-no" value="no">
        <label class="pill-radio" for="galileo-no">No</label>
      </div>
    </div>

    <!-- 18. Saldatura eseguita da (RFI / DITTA) -->
    <div class="form-group">
      <span class="label" id="lbl-saldatura">Saldatura eseguita da</span>
      <div class="pill-group"
           role="radiogroup"
           aria-labelledby="lbl-saldatura"
           style="grid-template-columns: repeat(2, 1fr);">
        <input class="pill-radio-input" type="radio" name="saldatura" id="sald-rfi" value="rfi">
        <label class="pill-radio" for="sald-rfi">RFI</label>

        <input class="pill-radio-input" type="radio" name="saldatura" id="sald-ditta" value="ditta" checked>
        <label class="pill-radio" for="sald-ditta">DITTA</label>
      </div>
    </div>

    <!-- 19. Porzione SA Ditta (Thermit / Railteck) -->
    <div class="form-group">
      <span class="label" id="lbl-sa">Porzione SA Ditta</span>
      <div class="pill-group"
           role="radiogroup"
           aria-labelledby="lbl-sa"
           style="grid-template-columns: repeat(2, 1fr);">
        <input class="pill-radio-input" type="radio" name="sa" id="sa-thermit" value="thermit" checked>
        <label class="pill-radio" for="sa-thermit">Thermit</label>

        <input class="pill-radio-input" type="radio" name="sa" id="sa-railteck" value="railteck">
        <label class="pill-radio" for="sa-railteck">Railteck</label>
      </div>
    </div>
  </fieldset>

  <!-- =================================================================
       SEZIONE 5 · DATI ESECUZIONE
       ================================================================= -->
  <fieldset class="form-step">
    <legend class="sect"><span>Dati Esecuzione</span></legend>

    <!-- 20. Ditta Esecutrice -->
    <div class="form-group">
      <label class="label" for="ditta">Ditta Esecutrice</label>
      <input class="input"
             id="ditta"
             name="ditta"
             type="text"
             value="M2 Rail Group"
             autocomplete="off">
    </div>

    <!-- 21. Data Esecuzione + N. Punzone -->
    <div class="input-row">
      <div class="form-group">
        <label class="label" for="data_ese">Data Esecuzione</label>
        <input class="input"
               id="data_ese"
               name="data_ese"
               type="text"
               inputmode="numeric"
               placeholder="MM/AAAA"
               value="03/2018"
               autocomplete="off">
      </div>
      <div class="form-group">
        <label class="label" for="punzone">N. Punzone</label>
        <input class="input"
               id="punzone"
               name="punzone"
               type="text"
               inputmode="numeric"
               value="447"
               autocomplete="off">
      </div>
    </div>

    <!-- 22. Palo T.E. N. -->
    <div class="form-group">
      <label class="label" for="palo_te">Palo T.E. N.</label>
      <input class="input"
             id="palo_te"
             name="palo_te"
             type="text"
             value="12B"
             autocomplete="off">
    </div>

    <!-- 23. Data Fine + Firma Operatore -->
    <div class="input-row">
      <div class="form-group">
        <label class="label" for="data_fin">Data Fine</label>
        <input class="input"
               id="data_fin"
               name="data_fin"
               type="text"
               inputmode="numeric"
               placeholder="GG/MM/AAAA"
               autocomplete="off">
      </div>
      <div class="form-group">
        <label class="label" for="firma">Firma Operatore</label>
        <input class="input"
               id="firma"
               name="firma"
               type="text"
               value="LP"
               autocomplete="off"
               autocapitalize="characters">
      </div>
    </div>
  </fieldset>

  <!-- =================================================================
       SEZIONE 6 · FIRMA (canvas)
       ================================================================= -->
  <fieldset class="form-step">
    <legend class="sect"><span>Firma</span></legend>

    <div class="form-group">
      <span class="label">Disegna la firma</span>
      <div class="sig-canvas-wrap">
        <canvas class="sig-canvas"
                id="sig-canvas"
                width="280"
                height="100"
                aria-label="Area firma"></canvas>
        <span class="sig-placeholder" id="sig-placeholder">Firma qui</span>
      </div>
      <div class="btn-row">
        <button class="btn-ghost" type="button" data-action="sig-clear">Cancella</button>
        <button class="btn-secondary" type="button" data-action="sig-load-profile">Carica firma da profilo</button>
      </div>
    </div>
  </fieldset>
</form>

<!-- ─────────────────────────────────────────────────────────────────────
     PREVIEW PANEL · placeholder (vuoto, hidden)
     ───────────────────────────────────────────────────────────────────── -->
<section id="scheda-preview-panel"
         role="tabpanel"
         aria-labelledby="scheda-tab-preview"
         hidden>
  <!-- preview render in produzione -->
</section>

<!-- ─────────────────────────────────────────────────────────────────────
     FOOTER STICKY · 2 col (Anteprima PDF · Salva)
     ───────────────────────────────────────────────────────────────────── -->
<footer class="scheda-foot" role="contentinfo">
  <button class="btn-ghost" type="button" data-action="scheda-preview-pdf">Anteprima PDF</button>
  <button class="btn-primary" type="submit" form="scheda-form-panel" data-action="scheda-save">Salva</button>
</footer>
