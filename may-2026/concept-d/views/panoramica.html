<!-- =====================================================================
     NEED_CLASS · riepilogo classi scaffold mancanti per questa vista
     =====================================================================
     LAYOUT/HEADER:
       .mese-head            — variante page-head con titolo + actions
       .mese-nav             — wrapper nav mese (button mese + OGGI)
       .mese-nav-btn         — button mono "< MAGGIO 2026 >"
       .mese-today-btn       — button piccolo "OGGI"

     FILTER CHIP:
       .chip-row             — flex orizzontale, overflow-x:auto, gap, padding scroll
       .chip                 — base chip pill, mono, uppercase, min-height ~28px
       .chip.active          — variant attivo
       .chip-amber           — accent amber (per "TUTTI")
       .chip-cyan            — accent cyan (La Spezia) — colore da definire (es. #38BDF8)
       .chip-green           — accent success
       .chip-warn            — accent warn
       .chip-danger          — accent danger

     CALENDARIO:
       .cal-grid-compact     — override su .cal-day min-height 38px in default,
                               bump a 48px in html.headlamp-mode
       .cal-day-today-soft   — bg amber soft (oltre outline amber già definito su .today)
       .dot.dot-cyan         — colore cyan #38BDF8 per La Spezia
       .dot-more             — mini text "+N" (font-size xxs, color muted)

     LEGENDA:
       .cal-legend           — flex wrap, font mono xxs, color muted, padding 6px 8px
       .legend-item          — inline-flex, gap 4px, allinea dot+label
       .legend-sep           — text-faint, mx 4px

     TABELLA AGENDA:
       .table-agenda         — override grid-template-columns: auto auto 1fr (3 col)
                               applicato sia su .table-head che su .row figli
       .row-data, .row-ora, .row-cant — celle agenda
       .row-multi            — border-left 2px amber per indicare multi-cantiere
     =====================================================================
-->
