<!-- ====================================================================
     LOGIN · Operations Terminal
     Stato di default: nessun utente selezionato → mostrare lista utenti.
     Stato selezionato: aggiungere classe "is-selected" su .login-wrap
       (oppure data-state="pin") per nascondere user list e mostrare numpad.
     Markup statico: entrambi i blocchi presenti, JS si occuperà del toggle.
     ==================================================================== -->

<div class="login-wrap login-crt" data-state="select">

  <!-- BRAND HEADER -->
  <header class="login-brand">
    <div class="logo-mark">M2</div>
    <h1 class="text-amber">M2 Diagnostica</h1>
    <div class="sub">v2.0</div>
  </header>

  <!-- ================================================================
       STATE A · USER SELECT
       Visibile quando data-state="select"
       ================================================================ -->
  <div class="login-card login-step login-step-user" data-step="user">

    <div class="divider-label">Seleziona operatore</div>

    <div class="user-list">

      <button type="button"
              class="user-card"
              data-action="select-user"
              data-user="LP"
              aria-label="Seleziona operatore Ludovico, gruppo G">
        <span class="user-sigla">LP</span>
        <span class="user-body">
          <span class="user-name">Ludovico</span>
          <span class="user-meta">Operatore · Gruppo G</span>
        </span>
        <span class="user-arrow" aria-hidden="true">›</span>
      </button>

      <button type="button"
              class="user-card"
              data-action="select-user"
              data-user="CA"
              aria-label="Seleziona operatore Cristopher, gruppo B">
        <span class="user-sigla">CA</span>
        <span class="user-body">
          <span class="user-name">Cristopher</span>
          <span class="user-meta">Operatore · Gruppo B</span>
        </span>
        <span class="user-arrow" aria-hidden="true">›</span>
      </button>

    </div>

  </div>

  <!-- ================================================================
       STATE B · PIN ENTRY
       Visibile quando data-state="pin"
       Statico in markup, JS toggla via data-state sul wrapper.
       ================================================================ -->
  <div class="login-card login-step login-step-pin" data-step="pin" hidden>

    <div class="divider-label">
      PIN
      <button type="button"
              class="pin-back"
              data-action="back-to-user"
              aria-label="Cambia operatore">‹ Cambia</button>
    </div>

    <!-- PIN DOTS (4 cifre, status live) -->
    <div class="pin-dots"
         role="status"
         aria-live="polite"
         aria-label="Cifre inserite: 0 di 4"
         data-pin-length="0">
      <span class="pin-dot" data-filled="false">●</span>
      <span class="pin-dot" data-filled="false">●</span>
      <span class="pin-dot" data-filled="false">●</span>
      <span class="pin-dot" data-filled="false">●</span>
    </div>

    <!-- NUMPAD 3x4 monospace -->
    <div class="numpad" role="group" aria-label="Tastiera numerica PIN">

      <button type="button" class="numkey" data-action="digit" data-digit="1" aria-label="Cifra 1">1</button>
      <button type="button" class="numkey" data-action="digit" data-digit="2" aria-label="Cifra 2">2</button>
      <button type="button" class="numkey" data-action="digit" data-digit="3" aria-label="Cifra 3">3</button>

      <button type="button" class="numkey" data-action="digit" data-digit="4" aria-label="Cifra 4">4</button>
      <button type="button" class="numkey" data-action="digit" data-digit="5" aria-label="Cifra 5">5</button>
      <button type="button" class="numkey" data-action="digit" data-digit="6" aria-label="Cifra 6">6</button>

      <button type="button" class="numkey" data-action="digit" data-digit="7" aria-label="Cifra 7">7</button>
      <button type="button" class="numkey" data-action="digit" data-digit="8" aria-label="Cifra 8">8</button>
      <button type="button" class="numkey" data-action="digit" data-digit="9" aria-label="Cifra 9">9</button>

      <button type="button" class="numkey numkey-aux" data-action="erase" aria-label="Cancella">←</button>
      <button type="button" class="numkey" data-action="digit" data-digit="0" aria-label="Cifra 0">0</button>
      <button type="button" class="numkey numkey-ok" data-action="confirm" aria-label="Conferma PIN">✓</button>

    </div>

  </div>

  <!-- FOOTER -->
  <div class="login-foot">M2 Rail Group</div>

</div>
